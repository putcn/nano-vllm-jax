name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff>=0.4

      - name: Lint
        run: ruff check nanovllm_jax/ tests/

  unit-tests:
    name: Unit Tests (CPU)
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU JAX)
        run: |
          # Install CPU-only JAX explicitly to avoid the cuda12 extra in pyproject.toml
          pip install "jax[cpu]>=0.4.25" "flax>=0.9.0" "optax>=0.2.0"
          pip install "transformers>=4.40.0" "safetensors>=0.4.0" "chex>=0.1.86" "numpy>=1.26"
          pip install "pytest>=8.0" pytest-xdist
          # Install package in editable mode without pulling in cuda12 extras
          pip install -e . --no-deps

      - name: Show JAX device
        run: python -c "import jax; print('JAX devices:', jax.devices())"

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short -x
