[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanovllm-jax"
version = "0.1.0"
description = "nano-vllm rewritten in JAX/Flax"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax[cuda12]>=0.4.25",
    "flax>=0.9.0",
    "optax>=0.2.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "chex>=0.1.86",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist",
    "ruff>=0.4",
    "mypy>=1.10",
    "torch>=2.3",  # only for numerical reference tests
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
